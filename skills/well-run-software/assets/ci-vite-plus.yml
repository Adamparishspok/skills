# Vite+ projects: setup-vp installs Node, the package manager and dependencies (from the lockfile).
# vp check = format check + type-aware lint + type check (with lint.options.typeAware and typeCheck on).
# Verify the SHAs are still the latest releases:
#   gh api repos/voidzero-dev/setup-vp/releases/latest --jq .tag_name
# Add the audit, semgrep and workflows jobs from ci.yml beside this one.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          cache: true
      - run: vp check
      - run: vp test run --passWithNoTests
      - run: vp build
