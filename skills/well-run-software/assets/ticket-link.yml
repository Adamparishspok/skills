# Fails a PR whose description has no ticket link. Set TICKET_PATTERN for your tracker:
#   Linear/Jira key:  ENG-[0-9]+  (your team key; the generic [A-Z][A-Z0-9]+-[0-9]+ also matches "UTF-8")
#   Linear URL:       linear\.app/[^ ]+/issue/
#   GitHub issue:     (close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+
# "retroactive" also passes, matching the PR template.
name: Ticket link
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions: {}
jobs:
  ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          if printf '%s' "$BODY" | grep -qE "$TICKET_PATTERN" || printf '%s' "$BODY" | grep -qi retroactive; then
            echo "Ticket link found."
          else
            echo "::error::Add a ticket link to the PR description (pattern: $TICKET_PATTERN)."
            exit 1
          fi
        env:
          BODY: ${{ github.event.pull_request.body }}
          TICKET_PATTERN: '[A-Z][A-Z0-9]+-[0-9]+'
